name: Sync Design Tokens

on:
  repository_dispatch:
    types: [tokens-release]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Name of branch in Tokens Studio to pull tokens from'
        type: string
        required: false
        default: 'main'

permissions:
  id-token: write # Required for OIDC authentication
  contents: write # Required to push the token branch
  pull-requests: write # Required to open tokens PR

defaults:
  run:
    working-directory: ./libs/@guardian/pulse

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    env:
      # fallback for `repository_dispatch` event where inputs not populated
      TOKENS_BRANCH: ${{ inputs.branch || 'main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-env

      - name: Create config file
        run: |
          cat > .studio.json << "EOF"
          {
            "version": 2,
            "source": {
              "project": "${{ vars.TOKENS_PROJECT }}",
              "ref": { "type": "branch", "name": "${{ env.TOKENS_BRANCH }}" }
            },
            "outputs": {
              "tokens": {
                "format": "dtcg",
                "dir": "src/tokens"
              }
            }
          }
          EOF

      - name: Clean token output folder
        run: rm -rf ./src/tokens

      - name: Pull tokens from Studio
        run: pnpm dlx @tokens-studio/studio-cli pull --ci

      - name: Format token files
        run: pnpm prettier src/tokens --write

      - name: Create branch and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: studio/${{ env.TOKENS_BRANCH }}
        run: |
          if git diff --quiet -- src/tokens; then
            echo "No changes to commit"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists, skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add src/tokens/
          git commit -m "chore: sync design tokens from Studio"
          git push -u origin "$BRANCH"

          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "chore: sync design tokens from Studio (${{ env.TOKENS_BRANCH }})" \
            --body "Automated sync of design tokens from the \`${{ env.TOKENS_BRANCH }}\` branch in Tokens Studio."
